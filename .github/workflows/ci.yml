name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout compatible MSCP
        uses: actions/checkout@v4
        with:
          repository: ming616/model-service-connector-pool
          ref: 9b98f37e1429d10050a8e985c615a6a4e2c72722
          path: .deps/model-service-connector-pool

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check --config pyproject.toml src tests examples

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/.deps/model-service-connector-pool/src
        run: pytest

