name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check --config pyproject.toml src tests examples

      - name: Test
        run: pytest

  integration:
    if: vars.ENABLE_MSCP_INTEGRATION == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAO
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout compatible MSCP
        uses: actions/checkout@v4
        with:
          repository: ming616/model-service-connector-pool
          ref: 7dd04f497962ac5ce52baa0de0c33f036ae0cbe3
          token: ${{ secrets.MSCP_READ_TOKEN || github.token }}
          persist-credentials: false
          path: .deps/model-service-connector-pool

      - name: Install
        run: pip install -e ".[dev]"

      - name: Integration test
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/.deps/model-service-connector-pool/src
        run: |
          python -c "import model_service_connector_pool"
          pytest tests/test_mscp_integration.py

